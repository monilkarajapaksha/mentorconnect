name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 1. Database migrations first, so new code never runs against an old schema.
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply calllog-db --remote
        working-directory: apps/api

      # 2. API Worker must exist before Pages binds to it.
      - name: Deploy API Worker
        run: npx wrangler deploy
        working-directory: apps/api

      # 3. Frontend + Pages Function (service binding comes from apps/web/wrangler.toml).
      - name: Build web
        run: npm run build -w @calllog/web
      - name: Deploy Pages
        run: npx wrangler pages deploy dist --project-name calllog-web --branch main
        working-directory: apps/web
